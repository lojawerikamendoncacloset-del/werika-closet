.lk{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 18px;border-radius:20px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid var(--line);
 box-shadow:0 2px 10px rgba(74,46,30,.06);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden;
 opacity:0;transform:translateY(14px);animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
.lk:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(74,46,30,.12);border-color:var(--gold)}
.lk:active{transform:scale(.98)}
.lk .ic{width:40px;height:40px;border-radius:12px;background:var(--sand);display:flex;align-items:center;justify-content:center;flex:none;color:var(--gold2)}
.lk .tx{flex:1;text-align:left;min-width:0}
.lk .tx b{display:block;font-weight:500;font-size:16px}
.lk .tx small{display:block;font-size:12px;color:var(--gold2);margin-top:2px}
.lk .ar{color:var(--gold);font-size:20px}
.lk.main{background:var(--dark);color:#F3E6D6;border-color:var(--dark)}
.lk.main .ic{background:rgba(201,164,106,.18);color:#E6CB93}
.lk.main .tx small{color:#CDB38A}
.lk.main .ar{color:#E6CB93}
.lk.main:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(231,201,142,.28) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.6s ease-in-out 1.2s infinite}
.lk.wa .ic{background:#E3F2EA;color:var(--wa)}
.lk.promo .ic{background:#F6E1DE;color:#A3402F}
@keyframes up{to{opacity:1;transform:none}}
@keyframes shine{0%{transform:translateX(-100%)}45%,100%{transform:translateX(100%)}}
.brands{display:flex;gap:10px;margin-top:26px;width:100%}
.brands span{flex:1;height:50px;border-radius:16px;background:var(--sand);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.brands img{max-height:22px;max-width:80%}
.brands img[src*="jean"]{max-height:15px}
.eyebrow{font-size:10px;letter-spacing:3px;color:var(--gold2);text-transform:uppercase;margin-top:28px}
.eyebrow+.brands{margin-top:10px}
footer{margin-top:30px;font-size:12px;color:#9B8571;line-height:1.6}
.hero-in{opacity:0;transform:translateY(10px);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
@media (prefers-reduced-motion:reduce){.lk,.hero-in{animation:none;opacity:1;transform:none}.lk.main:after{display:none}}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.lk{transition:transform .28s cubic-bezier(.2,.9,.3,1.4),box-shadow .28s,border-color .28s}
.lk.press{transform:scale(1.06)!important;box-shadow:0 16px 36px rgba(138,101,52,.28);border-color:var(--gold);z-index:2}
.lk.press .ic{transform:scale(1.15) rotate(-6deg)}
.lk .ic{transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.lk .rip{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);background:radial-gradient(circle,rgba(201,164,106,.45) 0%,rgba(201,164,106,0) 70%);animation:rip .6s ease-out forwards}
.lk.main .rip{background:radial-gradient(circle,rgba(231,201,142,.5) 0%,rgba(231,201,142,0) 70%)}
@keyframes rip{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.lk.press{transform:none!important}}

<script>
document.querySelectorAll('.lk').forEach(function(a){
 function ripple(x,y){var r=a.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,d=document.createElement('span');d.className='rip';
  d.style.width=d.style.height=s+'px';d.style.left=(x-r.left-s/2)+'px';d.style.top=(y-r.top-s/2)+'px';a.appendChild(d);setTimeout(function(){d.remove()},650);}
 a.addEventListener('pointerdown',function(e){a.classList.add('press');ripple(e.clientX,e.clientY);});
 ['pointerup','pointerleave','pointercancel'].forEach(function(t){a.addEventListener(t,function(){setTimeout(function(){a.classList.remove('press')},180);});});
 a.addEventListener('click',function(e){
  if(a.dataset.go==='1'||e.metaKey||e.ctrlKey)return;
  e.preventDefault();a.classList.add('press');var r=a.getBoundingClientRect();if(!a.querySelector('.rip'))ripple(r.left+r.width/2,r.top+r.height/2);
  setTimeout(function(){a.classList.remove('press');a.dataset.go='1';a.click();a.dataset.go='';},260);});
});
</script>
